services:
  mysql:
    image: mysql:8.0
    container_name: iot-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: iot_db
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"
    volumes:
      - iot-mysql-data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  app:
    image: rikka202/iot-query:1.0.0
    container_name: iot-query-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/iot_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-root}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      MY_IOT_PLATFORM: ${MY_IOT_PLATFORM:-njcl}
      MY_IOT_API_ID: ${MY_IOT_API_ID}
      MY_IOT_API_SECRET: ${MY_IOT_API_SECRET}
      MY_IOT_API_URL: ${MY_IOT_API_URL:-https://customer.iot-njcl.cn/api/v1/sim_cards/get_sim_card_detail}
      MY_IOT_CONNECT_TIMEOUT: ${MY_IOT_CONNECT_TIMEOUT:-20000}
      MY_IOT_READ_TIMEOUT: ${MY_IOT_READ_TIMEOUT:-30000}
    ports:
      - "8080:8080"

volumes:
  iot-mysql-data:
    name: iot-mysql-data
